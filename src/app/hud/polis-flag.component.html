@let e = emblem();

<svg
  class="flag"
  viewBox="0 0 24 28"
  [attr.width]="size()"
  [attr.height]="size() * 28 / 24"
  [attr.role]="label() ? 'img' : null"
  [attr.aria-label]="label() || null"
  [attr.aria-hidden]="label() ? null : 'true'">
  <!-- Crossbar and banner -->
  <rect class="flag__pole" x="0" y="0" width="24" height="2.2" rx="1" />
  <path class="flag__cloth" [style.fill]="fill()" d="M2.5 2 H21.5 V25.5 L12 21 L2.5 25.5 Z" />
  <path class="flag__trim" d="M4.5 3.8 H19.5 V22.6 L12 19 L4.5 22.6 Z" />

  <g class="flag__device" transform="translate(0 -0.5)">
    @if (e.kind === 'letter') {
      <text
        class="flag__letter"
        x="12"
        y="12.6"
        text-anchor="middle"
        dominant-baseline="central"
        [attr.font-size]="e.text.length > 1 ? 7.5 : 11">{{ e.text }}</text>
    } @else {
      @switch (e.symbol) {
        @case ('owl') {
          <path d="M8.2 7.2 L9.6 9.2 M15.8 7.2 L14.4 9.2" class="flag__stroke" />
          <ellipse cx="12" cy="13" rx="4.6" ry="5.6" />
          <circle cx="10.2" cy="11.2" r="1.7" [style.fill]="fill()" />
          <circle cx="13.8" cy="11.2" r="1.7" [style.fill]="fill()" />
          <path d="M11.3 13.4 L12 14.6 L12.7 13.4 Z" [style.fill]="fill()" />
        }
        @case ('shield') {
          <path d="M12 6 C16 6 17.8 8.6 17.8 9.6 C16.6 10.4 16.6 11.8 17.8 12.6 C17.8 14 16 18.6 12 18.6 C8 18.6 6.2 14 6.2 12.6 C7.4 11.8 7.4 10.4 6.2 9.6 C6.2 8.6 8 6 12 6 Z" />
        }
        @case ('wheel') {
          <circle cx="12" cy="12.3" r="5.4" class="flag__stroke" />
          <path d="M12 6.9 V17.7 M6.6 12.3 H17.4" class="flag__stroke" />
          <circle cx="12" cy="12.3" r="1.3" />
        }
        @case ('thunderbolt') {
          <path d="M13.6 5.4 L8.6 13.4 H11.6 L10.2 19.4 L15.6 10.8 H12.6 L14.6 5.4 Z" />
        }
        @case ('trident') {
          <path d="M12 19 V8.6 M8.6 6.4 V9.4 Q8.6 11.4 12 11.4 Q15.4 11.4 15.4 9.4 V6.4 M12 6 V11.4" class="flag__stroke" />
        }
        @case ('labyrinth') {
          <path d="M6.8 6.6 H17.2 V17.8 H8.6 V8.6 H15.2 V15.8 H10.6 V10.6 H13.2 V13.6" class="flag__stroke flag__stroke--thin" />
        }
        @case ('kantharos') {
          <path d="M8 8.2 H16 Q16 13.4 12 13.4 Q8 13.4 8 8.2 Z" />
          <path d="M8.2 9 Q5.6 9 6.2 11.6 Q6.8 13 8.8 12 M15.8 9 Q18.4 9 17.8 11.6 Q17.2 13 15.2 12" class="flag__stroke flag__stroke--thin" />
          <path d="M11.2 13.2 H12.8 V16.2 H11.2 Z M9.4 16.2 H14.6 V17.4 H9.4 Z" />
        }
        @case ('rose') {
          <circle cx="12" cy="9.2" r="2.6" />
          <circle cx="12" cy="15.4" r="2.6" />
          <circle cx="8.9" cy="12.3" r="2.6" />
          <circle cx="15.1" cy="12.3" r="2.6" />
          <circle cx="12" cy="12.3" r="1.5" [style.fill]="fill()" />
        }
        @case ('amphora') {
          <path d="M10.8 5.6 H13.2 V7.8 Q16.4 9.6 16.2 13 Q16 16.8 12 18.8 Q8 16.8 7.8 13 Q7.6 9.6 10.8 7.8 Z" />
          <path d="M10.8 7.4 Q8 7 8.4 10 M13.2 7.4 Q16 7 15.6 10" class="flag__stroke flag__stroke--thin" />
        }
      }
    }
  </g>
</svg>
