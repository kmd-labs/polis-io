<span class="trait" [class]="'trait trait--' + kind()" [appTooltip]="hint()" [attr.aria-label]="label() + ' ' + rounded() + '/5'">
  <span class="trait__label">{{ label() }}</span>
  <span class="trait__pips" aria-hidden="true">
    @for (fill of pips(); track $index) {
      <span class="trait__pip"><span class="trait__fill" [style.width.%]="fill * 100"></span></span>
    }
  </span>
</span>
